version: "3.9"

services:

  backend:
    build: .
    container_name: rag-backend

    command: uvicorn main:app --host 0.0.0.0 --port 8000

    ports:
      - "8000:8000"

    restart: always

    env_file:
      - .env

    volumes:
      - ./uploads:/app/uploads
      - ./vectorstore:/app/vectorstore

  frontend:
    build: .
    container_name: rag-frontend

    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0

    ports:
      - "8501:8501"

    depends_on:
      - backend

    restart: always

    env_file:
      - .env